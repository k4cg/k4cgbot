name: Go package

on:
  pull_request:
  push:
    branches: [ "master" ]

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Run fmt
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build

  build-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nix package
        run: docker build -f Dockerfile.nixbuild .
